<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABI コテージ管理ダッシュボード</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ═══ ログイン画面 ═══════════════════════════════ -->
    <div id="loginScreen" class="screen">
        <div class="login-box">
            <div class="login-logo">
                <div class="logo-icon">🏡</div>
                <h1>TABI 管理ポータル</h1>
                <p>コテージ管理者専用ログイン</p>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="field">
                    <label for="emailInput">メールアドレス</label>
                    <input id="emailInput" type="email" placeholder="cottage.manager@example.test" required
                        autocomplete="username">
                </div>
                <div class="field">
                    <label for="passInput">パスワード</label>
                    <input id="passInput" type="password" placeholder="パスワード" required autocomplete="current-password">
                </div>
                <p id="loginErr" class="err-msg" hidden></p>
                <button type="submit" id="loginBtn" class="btn-primary">ログイン</button>
            </form>
            <p class="login-switch">アカウントをお持ちでない方は
                <button type="button" id="toRegisterBtn" class="btn-link">新規登録</button>
            </p>
        </div>
    </div>

    <!-- ═══ 新規登録画面 ════════════════════════════════ -->
    <div id="registerScreen" class="screen hidden">
        <div class="login-box">
            <div class="login-logo">
                <div class="logo-icon">🏡</div>
                <h1>新規管理人登録</h1>
                <p>担当ホテルのチャットIDをご用意ください</p>
            </div>

            <form id="registerForm" autocomplete="off">
                <div class="field">
                    <label for="regNameInput">名前</label>
                    <input id="regNameInput" type="text" placeholder="山田 太郎" required maxlength="100">
                </div>
                <div class="field">
                    <label for="regEmailInput">メールアドレス</label>
                    <input id="regEmailInput" type="email" placeholder="manager@example.com" required
                        autocomplete="username">
                </div>
                <div class="field">
                    <label for="regPassInput">パスワード（6文字以上）</label>
                    <input id="regPassInput" type="password" placeholder="パスワード" required minlength="6"
                        autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="regChatIdInput">担当ホテルのチャットID</label>
                    <input id="regChatIdInput" type="number" placeholder="例: 2" required min="1">
                    <span class="field-hint">ホテルチャットのIDはシステム管理者にご確認ください</span>
                </div>
                <p id="registerErr" class="err-msg" hidden></p>
                <p id="registerOk" class="ok-msg" hidden></p>
                <button type="submit" id="registerBtn" class="btn-primary">登録する</button>
            </form>
            <p class="login-switch">
                <button type="button" id="toLoginBtn" class="btn-link">← ログインに戻る</button>
            </p>
        </div>
    </div>

    <!-- ═══ メインアプリ ══════════════════════════════ -->
    <div id="appScreen" class="screen hidden">

        <!-- ヘッダー -->
        <header class="app-header">
            <span class="hd-logo">🏡 TABI カスタマー</span>
            <div class="hd-right">
                <span id="hdUser" class="hd-user"></span>
                <button id="logoutBtn" class="btn-logout">ログアウト</button>
            </div>
        </header>

        <div class="app-body">

            <!-- 左ペイン：チャット一覧 -->
            <aside id="listPane" class="list-pane">
                <div class="list-header">
                    <h2>コテージチャット</h2>
                    <span class="list-sub">旅行者からのメッセージ</span>
                </div>
                <div id="chatList" class="chat-list">
                    <p class="loading-txt">読み込み中…</p>
                </div>
            </aside>

            <!-- 右ペイン：チャット詳細 -->
            <main id="chatPane" class="chat-pane">

                <!-- 空状態 -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">💬</div>
                    <p>左のリストからチャットを選択してください</p>
                </div>

                <!-- チャットヘッダー -->
                <div id="chatHeader" class="chat-header hidden">
                    <button id="backToListBtn" class="back-btn" title="一覧へ戻る">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18"
                            height="18">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        一覧
                    </button>
                    <div class="chat-title-block">
                        <h3 id="chatTitle" class="chat-title"></h3>
                        <span id="chatSub" class="chat-sub"></span>
                    </div>
                    <span id="connBadge" class="conn-badge conn-connecting">接続中…</span>
                </div>

                <!-- メッセージエリア -->
                <div id="msgArea" class="msg-area hidden">
                    <div id="msgList" class="msg-list"></div>
                    <div id="msgEnd"></div>
                </div>

                <!-- 入力欄 -->
                <div id="inputArea" class="input-area hidden">
                    <form id="msgForm">
                        <!-- 非表示ファイル入力 -->
                        <input id="imageFileInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp"
                            style="display:none">
                        <!-- 画像送信ボタン -->
                        <button type="button" id="imageBtn" class="btn-image" title="画像を送信" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"
                                height="20" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <polyline points="21 15 16 10 5 21" />
                            </svg>
                        </button>
                        <textarea id="msgInput" placeholder="旅行者にメッセージを送る…" maxlength="1000"
                            autocomplete="off" rows="1"></textarea>
                        <button type="submit" id="sendBtn" class="btn-send" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18"
                                height="18">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                    </form>
                    <p id="sendErr" class="send-err hidden"></p>
                </div>

            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
